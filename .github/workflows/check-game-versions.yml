name: Check game versions

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: check-game-versions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.BUMP_PUSH_TOKEN }}

      - name: Check for game version updates
        id: check
        run: python3 .github/scripts/check-game-versions.py --rewrite

      - name: Create and merge bump PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
          BRANCH: ${{ steps.check.outputs.branch }}
          ANN_OLD: ${{ steps.check.outputs.ann_old }}
          ANN_NEW: ${{ steps.check.outputs.ann_new }}
          ANN_VER: ${{ steps.check.outputs.ann_ver }}
          ERA_OLD: ${{ steps.check.outputs.era_old }}
          ERA_NEW: ${{ steps.check.outputs.era_new }}
          ERA_VER: ${{ steps.check.outputs.era_ver }}
        run: |
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "Open PR already exists for $BRANCH — skipping"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH exists on remote with no open PR — deleting orphan"
            git push origin --delete "$BRANCH"
          fi

          parts=""
          if [ "$ANN_OLD" != "$ANN_NEW" ]; then
            parts="$ANN_OLD -> $ANN_NEW (anniversary)"
          fi
          if [ "$ERA_OLD" != "$ERA_NEW" ]; then
            [ -n "$parts" ] && parts="$parts, "
            parts="${parts}$ERA_OLD -> $ERA_NEW (era)"
          fi
          msg="bump: Interface $parts"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add addons/
          git commit -m "$msg"
          git push -u origin "$BRANCH"

          body="Game version update detected."
          [ "$ANN_OLD" != "$ANN_NEW" ] && body="$body"$'\n'"- **TBC Anniversary:** $ANN_VER — Interface $ANN_OLD → $ANN_NEW"
          [ "$ERA_OLD" != "$ERA_NEW" ] && body="$body"$'\n'"- **Classic Era:** $ERA_VER — Interface $ERA_OLD → $ERA_NEW"
          body="$body"$'\n\n'"Auto-generated by the daily game-version watcher."

          pr_url=$(gh pr create --title "$msg" --body "$body")

          gh pr merge "$pr_url" --merge --delete-branch --auto || \
            gh pr merge "$pr_url" --merge --delete-branch
