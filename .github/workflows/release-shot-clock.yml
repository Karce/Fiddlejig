name: Release ShotClock

# run_number resets to 1 if this workflow file is renamed
on:
  push:
    branches: [main]
    paths: ['addons/ShotClock/**']

concurrency:
  group: release-ShotClock
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADDON: ShotClock
      CF_PROJECT_ID: "1652667"
      VERSION: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package addon
        run: python3 .github/scripts/package-addon.py "addons/$ADDON" "$VERSION" --out-dir dist

      - name: Resolve CurseForge game version IDs
        id: versions
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ids=$(python3 .github/scripts/resolve-game-versions.py \
            "addons/$ADDON/$ADDON.toc" \
            "addons/$ADDON/${ADDON}_Vanilla.toc")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GAME_VERSION_IDS: ${{ steps.versions.outputs.ids }}
        run: |
          changelog=$(echo "$COMMIT_MSG" | head -1)
          changelog="$changelog (${GITHUB_SHA::7})"
          metadata=$(python3 -c "
          import json, sys
          print(json.dumps({
              'changelog': sys.argv[1],
              'changelogType': 'markdown',
              'displayName': f'{sys.argv[2]} {sys.argv[3]}',
              'gameVersions': json.loads(sys.argv[4]),
              'releaseType': 'release',
          }))" "$changelog" "$ADDON" "$VERSION" "$GAME_VERSION_IDS")
          http_code=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$metadata" \
            -F "file=@dist/$ADDON-$VERSION.zip")
          if [ "$http_code" != "200" ]; then
            echo "ERROR: CurseForge upload returned HTTP $http_code" >&2
            cat response.txt >&2
            exit 1
          fi
          echo "Uploaded $ADDON $VERSION (HTTP $http_code)"
