[package]
name = "autofisher-3000"
version = "0.1.0"
edition = "2021"
description = "World of Warcraft fishing bot — Wayland-native (XDG portals), OpenCV bobber detection"
license = "MIT"

# Library holds the testable logic; the binary is the thin imperative shell.
[lib]
name = "autofisher"
path = "src/lib.rs"

[[bin]]
name = "autofisher-3000"
path = "src/main.rs"

[features]
# Default = today's behaviour: ort-sys downloads a prebuilt ONNX Runtime at build
# time and static-links it. Needs network. This is what the devcontainer and
# `cargo test` use.
default = ["ort-download"]
ort-download = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]
# Flatpak/offline builds: dlopen libonnxruntime.so at runtime from $ORT_DYLIB_PATH.
# Implies ort-sys/disable-linking, whose build script returns immediately, so no
# build-time network access is even attempted.
ort-dylib = ["ort/load-dynamic"]

[dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
opencv = { version = "0.98", default-features = false, features = ["imgproc", "objdetect", "imgcodecs", "videoio", "highgui"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# ONNX Runtime inference for the learned bobber detector (multi-threaded). How
# libonnxruntime is obtained is chosen by the `ort-download` / `ort-dylib`
# features above; this list is ort's default set minus those linking features, so
# `--features ort-download` reproduces the stock build exactly (Cargo.lock unchanged).
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "api-24",
] }
